<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanda Tanaka</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cor-primaria: #fd267a; 
            --cor-secundaria: #ff6036; 
            --texto-principal: #ffffff;
            --texto-secundario: #cbd5e1;
            --glow: 0 0 25px rgba(253, 38, 122, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-image: 
                linear-gradient(to bottom, rgba(5, 5, 5, 0.6) 0%, rgba(5, 5, 5, 0.95) 100%),
                url('https://i.postimg.cc/T1YTcctt/fyirje1s.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            color: var(--texto-principal);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1.2rem;
        }

        .glass-container {
            width: 100%;
            max-width: 400px;
            background: rgba(20, 20, 20, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .profile-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 0.5rem;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--cor-primaria);
            box-shadow: var(--glow);
            position: relative;
            z-index: 2;
        }

        .verified-badge {
            position: absolute;
            bottom: 5px;
            right: 2px;
            background: #1d9bf0;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            border: 2px solid #1a1a1a;
        }

        /* NOME DA MODELO */
        .model-name {
            font-size: 1.35rem;
            font-weight: 900;
            margin-top: -0.6rem; /* Puxa o nome para perto da foto */
            letter-spacing: 0.5px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .status-badge {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 auto;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        h1 {
            font-weight: 900;
            font-size: 1.5rem;
            line-height: 1.2;
            letter-spacing: -0.5px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .icon-headline {
            color: var(--cor-primaria);
            width: 28px;
            height: 28px;
        }

        p.subheadline {
            font-size: 0.95rem;
            color: var(--texto-secundario);
            line-height: 1.4;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .btn-cta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(90deg, var(--cor-primaria), var(--cor-secundaria), var(--cor-primaria));
            background-size: 200% auto;
            padding: 1.2rem;
            border-radius: 14px;
            text-decoration: none;
            color: white;
            font-weight: 900;
            font-size: 1.05rem;
            text-transform: uppercase;
            box-shadow: 0 8px 25px rgba(253, 38, 122, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: gradient-shift 3s infinite linear, pulse-btn 2.5s infinite;
        }

        .btn-cta:active { transform: scale(0.95); }

        .btn-cta::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 3s infinite;
        }

        .icon-fire {
            width: 24px;
            height: 24px;
            animation: burn 1.5s infinite alternate;
        }

        @keyframes burn {
            0% { transform: scale(1); }
            100% { transform: scale(1.15) rotate(-5deg); }
        }

        @keyframes gradient-shift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        @keyframes pulse-btn {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        footer {
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        
        <div class="profile-wrapper">
            <img src="https://i.postimg.cc/hjN0LC4n/Captura-de-tela-2026-05-16-012956-removebg-preview.png" alt="Nanda Tanaka" class="profile-pic">
            <div class="verified-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
            </div>
        </div>

        <div class="model-name">Nanda Tanaka</div>

        <div class="status-badge">
            <span class="dot"></span> online agora
        </div>

        <h1>
            Finalmente você veio amor... 
            <svg class="icon-headline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        </h1>
        
        <p class="subheadline">O que o TikTok não me deixa mostrar, eu libero tudo aqui. Vamos pro meu Telegram aproveitar do jeitinho certo...</p>

        <div style="margin-top: 10px;">
            <a href="https://t.me/tanakaavipbot?start=/start" class="btn-cta" id="telegram-link">
                <svg class="icon-fire" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
                </svg>
                VER CONTEÚDO SEM CENSURA
            </a>
        </div>

    </div>

    <footer>
        © 2024 Nanda Tanaka. Todos os direitos reservados.<br>
        Acesso estritamente para maiores de 18 anos.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const btnLink = document.getElementById('telegram-link');
            
            // UTMs padrão que serão injetadas sempre
            const defaultUTMs = "utm_source=tiktok&utm_campaign=bio&utm_medium=organic&utm_content=profile&shk=mucqj9ww";

            if (btnLink) {
                const originalHref = btnLink.getAttribute('href');
                
                // Pega os parâmetros da URL caso a pessoa clique em um anúncio com UTMs extras
                const urlParams = window.location.search.substring(1); 
                
                // Junta as UTMs da URL (se tiver) com as suas UTMs padrão
                let finalParams = defaultUTMs;
                if (urlParams) {
                    finalParams += "&" + urlParams;
                }

                // O link do Telegram já tem o ?start=/start, então usamos o & para adicionar as UTMs
                const separator = originalHref.includes('?') ? '&' : '?';
                
                // Atualiza o link do botão
                btnLink.setAttribute('href', originalHref + separator + finalParams);
            }
        });
    </script>
</body>
</html>

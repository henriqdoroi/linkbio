<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nanda Tanaka | Oficial</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cor-fundo: #050505;
            --cor-primaria: #fd267a; /* Rosa vibrante estilo Tinder/Hot */
            --cor-secundaria: #ff6036; /* Laranja fogo */
            --cor-texto: #ffffff;
            --glow: 0 0 20px rgba(253, 38, 122, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--cor-fundo);
            background-image: 
                radial-gradient(circle at 50% -20%, #25102a 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, #101010 0%, transparent 40%);
            color: var(--cor-texto);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Foto de perfil com brilho */
        .profile-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 1.5rem;
        }

        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--cor-primaria);
            box-shadow: var(--glow);
            position: relative;
            z-index: 2;
        }

        .verified-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: #1d9bf0;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            border: 2px solid var(--cor-fundo);
        }

        /* Headline Emocional */
        h1 {
            font-weight: 900;
            font-size: 1.6rem;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-online {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: #4ade80;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* O Botão de Desejo */
        .btn-vip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: linear-gradient(45deg, var(--cor-primaria), var(--cor-secundaria));
            padding: 1.3rem;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(253, 38, 122, 0.4);
            transition: transform 0.2s ease;
            position: relative;
            overflow: hidden;
            animation: pulse 2s infinite;
        }

        .btn-vip:active { transform: scale(0.95); }

        /* Brilho que passa pelo botão */
        .btn-vip::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255,255,255,0.2);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .micro-copy {
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: #888;
            font-style: italic;
        }

        /* Footer Seguro */
        footer {
            margin-top: auto;
            padding-top: 3rem;
            font-size: 0.7rem;
            color: #444;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-wrapper">
            <img src="LINK_DA_FOTO_AQUI" alt="Nanda Tanaka" class="profile-pic">
            <div class="verified-badge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
            </div>
        </div>

        <h1>Finalmente você chegou... 😈</h1>
        
        <div class="status-online">
            <span class="dot"></span>
            Disponível agora no privado
        </div>

        <div style="margin-top: 10px;">
            <a href="https://t.me/SEU_BOT_AQUI" class="btn-vip" id="cta-link">
                <span style="font-size: 1.5rem;">🔞</span>
                VER MEU CONTEÚDO SECRETO
            </a>
        </div>

        <p class="micro-copy">Clique acima para abrir nossa conversa no Telegram.</p>
    </div>

    <footer>
        © 2024 Nanda Tanaka Oficial. Todos os direitos reservados.<br>
        Acesso permitido apenas para maiores de 18 anos.
    </footer>

    <script>
        // SCRIPT PARA NÃO PERDER O TRACKING (UTMs)
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = window.location.search;
            const ctaBtn = document.getElementById('cta-link');

            if (urlParams && ctaBtn) {
                const originalHref = ctaBtn.getAttribute('href');
                const separator = originalHref.includes('?') ? '&' : '?';
                ctaBtn.setAttribute('href', originalHref + separator + urlParams.substring(1));
            }
        });
    </script>
</body>
</html>
